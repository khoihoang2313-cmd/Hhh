<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>License System Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body {
    background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
    color:#eaeaea; min-height:100vh; padding:20px;
  }
  .nav {
    max-width:900px; margin:0 auto 24px; display:flex; gap:10px;
    background:#16162a; padding:10px; border-radius:12px;
    border:1px solid #262640;
  }
  .nav button {
    flex:1; padding:12px; border:none; border-radius:8px;
    background:transparent; color:#888; font-weight:600;
    cursor:pointer; transition:0.2s; font-size:14px;
  }
  .nav button.active {
    background:linear-gradient(90deg,#00d4ff,#7b2ff7); color:#fff;
  }
  .nav button:hover:not(.active) { background:#22223a; color:#ccc; }

  .page { display:none; max-width:900px; margin:0 auto; }
  .page.active { display:block; }

  .card {
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    border-radius:18px; padding:28px; backdrop-filter:blur(12px);
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  h1 {
    font-size:22px; margin-bottom:6px; text-align:center;
    background:linear-gradient(90deg,#00d4ff,#7b2ff7);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub { text-align:center; font-size:12px; color:#888; margin-bottom:22px; }
  label { font-size:13px; color:#aaa; display:block; margin-bottom:6px; margin-top:12px; }
  input, select {
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid #333;
    background:#16162a; color:#fff; font-size:14px; outline:none; transition:0.2s;
  }
  input:focus, select:focus { border-color:#00d4ff; box-shadow:0 0 0 3px rgba(0,212,255,0.15); }
  .btn {
    width:100%; padding:12px; margin-top:14px; border:none; border-radius:10px;
    font-size:14px; font-weight:600; cursor:pointer; transition:0.2s;
    background:linear-gradient(90deg,#00d4ff,#7b2ff7); color:#fff;
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,212,255,0.3); }
  .btn.secondary { background:#22223a; color:#ccc; }
  .btn.danger { background:linear-gradient(90deg,#ff416c,#ff4b2b); }
  .msg { margin-top:14px; padding:10px; border-radius:8px; font-size:13px;
         text-align:center; display:none; }
  .msg.ok { background:rgba(0,255,150,0.1); color:#00ff9d;
            border:1px solid rgba(0,255,150,0.3); display:block; }
  .msg.err { background:rgba(255,60,60,0.1); color:#ff6b6b;
             border:1px solid rgba(255,60,60,0.3); display:block; }
  .hidden { display:none !important; }
  .key-item {
    background:#16162a; border:1px solid #262640; border-radius:8px;
    padding:10px 12px; margin-top:8px; font-size:12px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .key-item .code { color:#00d4ff; font-family:monospace; font-weight:600; }
  .key-item .status { font-size:11px; }
  .key-item .active { color:#00ff9d; }
  .key-item .expired { color:#ff6b6b; }
  .key-item .forever { color:#ffd700; font-weight:700; }
  .key-item button {
    width:auto; padding:5px 12px; margin:0; font-size:11px;
    background:#ff416c; border:none; border-radius:6px; color:#fff; cursor:pointer;
  }
  #remain { font-size:16px; color:#ccc; text-align:center; margin:16px 0; }
  .forever-display { color:#ffd700 !important; font-weight:700; font-size:18px; }
</style>
</head>
<body>

<!-- NAV -->
<div class="nav">
  <button class="active" onclick="showPage('app')">📱 Trang App (User)</button>
  <button onclick="showPage('admin')">⚙️ Trang Admin</button>
</div>

<!-- ============ TRANG APP ============ -->
<div id="page-app" class="page active">
  <div class="card">
    <div id="licenseForm">
      <h1>🔑 Kích Hoạt</h1>
      <p class="sub">Nhập key 1 lần, dùng đến khi hết hạn</p>
      <input id="keyInput" placeholder="HK-XXXX-XXXX" style="text-align:center;font-family:monospace;letter-spacing:1px;">
      <button class="btn" onclick="activate()">Kích Hoạt</button>
      <div id="userMsg" class="msg"></div>
    </div>

    <div id="appContent" class="hidden" style="text-align:center;">
      <h1>✅ Đã Kích Hoạt</h1>
      <p id="remain"></p>
      <button class="btn secondary" onclick="logout()">Đăng Xuất</button>
    </div>
  </div>
</div>

<!-- ============ TRANG ADMIN ============ -->
<div id="page-admin" class="page">
  <div class="card">
    <div id="adminLogin">
      <h1>🛡️ Admin Login</h1>
      <p class="sub">Nhập key admin để vào</p>
      <input id="adminKey" type="password" placeholder="Nhập admin key...">
      <button class="btn" onclick="adminLogin()">Đăng Nhập</button>
      <div id="loginMsg" class="msg"></div>
    </div>

    <div id="adminPanel" class="hidden">
      <h1>⚙️ Tạo Key</h1>
      <p class="sub">Chọn thời lượng và số lượng</p>

      <label>Thời lượng</label>
      <select id="duration">
        <option value="1">1 Giờ</option>
        <option value="12">12 Giờ</option>
        <option value="24">1 Ngày</option>
        <option value="168">7 Ngày</option>
        <option value="720">1 Tháng (30 ngày)</option>
        <option value="0">♾️ Vĩnh Viễn</option>
      </select>

      <label>Số lượng</label>
      <input id="qty" type="number" value="1" min="1" max="50">

      <button class="btn" onclick="createKeys()">Tạo Key</button>
      <button class="btn secondary" onclick="renderKeys()">Tải Danh Sách</button>
      <button class="btn danger" onclick="clearAll()">Xóa Toàn Bộ</button>
      <button class="btn secondary" onclick="adminLogout()">Đăng Xuất</button>

      <div id="adminMsg" class="msg"></div>
      <div id="keyList" style="margin-top:16px; max-height:300px; overflow-y:auto;"></div>
    </div>
  </div>
</div>

<script>
/* ============ CẤU HÌNH ============ */
const ADMIN_KEY = "HHOANGKHOI-ADMIN";
const STORAGE = "demo_keys";
const LS_LICENSE = "demo_license";

/* ============ LƯU TRỮ ============ */
function getKeys() { return JSON.parse(localStorage.getItem(STORAGE) || "{}"); }
function saveKeys(o) { localStorage.setItem(STORAGE, JSON.stringify(o)); }

/* ============ UI ============ */
function showPage(name) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  document.getElementById("page-" + name).classList.add("active");
  event.target.classList.add("active");
  if (name === "admin" && !document.getElementById("adminPanel").classList.contains("hidden")) {
    renderKeys();
  }
}
function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "msg " + type;
}
function hideMsg(id) { document.getElementById(id).className = "msg"; }

/* ============ TIỆN ÍCH ============ */
function genCode() {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "HK-";
  for (let i=0;i<4;i++) s += c[Math.floor(Math.random()*c.length)];
  s += "-";
  for (let i=0;i<4;i++) s += c[Math.floor(Math.random()*c.length)];
  return s;
}
function fmt(ts) { return new Date(ts).toLocaleString("vi-VN"); }

/* ============ APP (USER) ============ */
function activate() {
  const code = document.getElementById("keyInput").value.trim().toUpperCase();
  if (!code) return showMsg("userMsg", "Nhập key đi!", "err");

  const keys = getKeys();
  const k = keys[code];
  if (!k) return showMsg("userMsg", "❌ Key không tồn tại!", "err");

  const forever = k.duration === 0;
  if (!forever && Date.now() > k.expires) {
    return showMsg("userMsg", "⛔ Key đã hết hạn lúc: " + fmt(k.expires), "err");
  }

  localStorage.setItem(LS_LICENSE, JSON.stringify({
    key: code, expires: k.expires, forever
  }));
  hideMsg("userMsg");
  showApp(k.expires, forever);
}
function showApp(expires, forever) {
  document.getElementById("licenseForm").classList.add("hidden");
  document.getElementById("appContent").classList.remove("hidden");

  if (forever) {
    document.getElementById("remain").innerHTML =
      '<span class="forever-display">♾️ KEY VĨNH VIỄN</span>';
    return;
  }
  tick(expires);
  setInterval(() => tick(expires), 1000);
}
function tick(expires) {
  const left = expires - Date.now();
  if (left <= 0) {
    localStorage.removeItem(LS_LICENSE);
    logout();
    showMsg("userMsg", "⛔ Key đã hết hạn!", "err");
    return;
  }
  const h = Math.floor(left/3600000);
  const m = Math.floor((left%3600000)/60000);
  const s = Math.floor((left%60000)/1000);
  document.getElementById("remain").textContent = `Còn lại: ${h}h ${m}m ${s}s`;
}
function logout() {
  localStorage.removeItem(LS_LICENSE);
  document.getElementById("licenseForm").classList.remove("hidden");
  document.getElementById("appContent").classList.add("hidden");
  document.getElementById("keyInput").value = "";
  hideMsg("userMsg");
}

/* Tự kiểm tra khi mở trang */
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem(LS_LICENSE);
  if (!saved) return;
  const { expires, forever } = JSON.parse(saved);
  if (forever) { showApp(0, true); return; }
  if (Date.now() > expires) { localStorage.removeItem(LS_LICENSE); return; }
  showApp(expires, false);
});

/* ============ ADMIN ============ */
function adminLogin() {
  const k = document.getElementById("adminKey").value.trim();
  if (k === ADMIN_KEY) {
    document.getElementById("adminLogin").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    hideMsg("loginMsg");
    renderKeys();
  } else {
    showMsg("loginMsg", "❌ Sai admin key!", "err");
  }
}
function adminLogout() {
  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("adminLogin").classList.remove("hidden");
  document.getElementById("adminKey").value = "";
  hideMsg("adminMsg");
}
function createKeys() {
  const hours = parseInt(document.getElementById("duration").value);
  const qty = parseInt(document.getElementById("qty").value) || 1;
  const isForever = hours === 0;

  const keys = getKeys();
  const created = [];
  for (let i=0;i<qty;i++) {
    let code;
    do { code = genCode(); } while (keys[code]);
    keys[code] = {
      created: Date.now(),
      expires: isForever ? 0 : Date.now() + hours*3600000,
      duration: hours
    };
    created.push(code);
  }
  saveKeys(keys);
  showMsg("adminMsg",
    `✅ Đã tạo ${qty} key ${isForever ? "(VĨNH VIỄN)" : "(" + hours + "h)"}`, "ok");
  renderKeys();
}
function renderKeys() {
  const keys = getKeys();
  const list = document.getElementById("keyList");
  const codes = Object.keys(keys);
  if (!codes.length) {
    list.innerHTML = `<div class="key-item"><span>Chưa có key nào.</span></div>`;
    return;
  }
  const now = Date.now();
  list.innerHTML = codes.map(code => {
    const k = keys[code];
    const forever = k.duration === 0;
    const expired = !forever && now > k.expires;
    let statusHtml;
    if (forever) statusHtml = `<span class="status forever">♾️ VĨNH VIỄN</span>`;
    else if (expired) statusHtml = `<span class="status expired">HẾT HẠN - ${fmt(k.expires)}</span>`;
    else statusHtml = `<span class="status active">CÒN HẠN - ${fmt(k.expires)}</span>`;

    return `<div class="key-item">
      <div><span class="code">${code}</span><br>${statusHtml}</div>
      <button onclick="delKey('${code}')">Xóa</button>
    </div>`;
  }).join("");
}
function delKey(code) {
  const keys = getKeys();
  delete keys[code];
  saveKeys(keys);
  renderKeys();
}
function clearAll() {
  if (!confirm("Xóa toàn bộ key?")) return;
  localStorage.removeItem(STORAGE);
  renderKeys();
  showMsg("adminMsg", "🗑️ Đã xóa toàn bộ", "ok");
}
</script>
</body>
</html>
